<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon-briefcast.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO Meta Tags -->
  <meta name="description" content="Briefcast - Real-time news reader that aggregates top stories from trusted sources for a clean, focused reading experience." />
  <meta name="keywords" content="news, technology news, real-time news, news aggregator, Briefcast" />
  <meta name="author" content="Briefcast" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Briefcast - Elegant news reader" />
  <meta property="og:description" content="Real-time news aggregation with a beautiful, distraction-free reading experience." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://newsnow.busiyi.world" />
  <meta property="og:image" content="https://newsnow.busiyi.world/og-image.png" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Briefcast - Elegant news reader" />
  <meta name="twitter:description" content="Real-time news aggregation with a beautiful, distraction-free reading experience." />
  <meta name="twitter:image" content="https://newsnow.busiyi.world/og-image.svg" />

  <meta name="theme-color" content="#F7882F" />
  <link rel="preload" href="/Baloo2-Bold.subset.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- Schema.org markup for Google -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Briefcast",
      "url": "https://newsnow.busiyi.world",
      "description": "Briefcast is a real-time news reader that brings together top stories from trusted global sources in a clean, focused interface."
    }
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EL9HHYE5LC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-EL9HHYE5LC');
  </script>

  <script>
    const query = new URLSearchParams(window.location.search)
    if (query.has("login") && query.has("user") && query.has("jwt")) {
      localStorage.setItem("user", query.get("user"))
      localStorage.setItem("jwt", JSON.stringify(query.get("jwt")))
      window.history.replaceState({}, document.title, window.location.pathname)
    }
  </script>
  <title>Briefcast</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
